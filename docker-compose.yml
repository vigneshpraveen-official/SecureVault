services:
  postgres:
    image: postgres:16-alpine
    container_name: securevault-postgres
    environment:
      POSTGRES_DB: securevault
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - securevault-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d securevault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: securevault-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - securevault-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: securevault-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  securevault-postgres-data:
  securevault-redis-data:
