spring:
  application:
    name: securevault
  profiles:
    active: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # Defaults target MailHog (docker-compose, no auth, no TLS) — S0.1's local dev SMTP. A real
  # provider (Gmail etc, prod profile) needs auth=true + starttls, tracked as a P8.x TODO
  # alongside the other prod-only overrides in application-prod.yml.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# JWT_SECRET and AES_SECRET_KEY are intentionally read with NO default here.
# The app must fail fast at startup if they are missing rather than run insecurely.
app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    jwt-refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
    aes-secret-key: ${AES_SECRET_KEY}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
